.wrap{max-width:1240px;margin:0 auto}
h1{font-family:var(--title);font-weight:700;font-size:clamp(40px,9vw,68px);line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.sub{margin:6px 0 16px;color:var(--muted);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.bar a{font-family:var(--title);font-size:24px;font-weight:700;color:var(--head);text-decoration:none;border:2px solid var(--head);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:2px 18px;line-height:1.3}

.sheet{column-width:320px;column-gap:22px}
.note{break-inside:avoid;margin:0 0 22px;padding:15px 14px 0 38px;border-radius:3px;border:1px solid var(--edge);

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/_\{(.*?)\}/g,'<sub>$1</sub>').replace(/\^\{(.*?)\}/g,'<sup>$1</sup>');
const line=l=>l[0]==='*'?'<p><mark>'+fmt(l.slice(1))+'</mark></p>':'<p>'+fmt(l)+'</p>';
function draw(id,data){
  document.getElementById(id).innerHTML=data.map(n=>
    '<section class="note"><h3>'+fmt(n[0])+'</h3>'+n.slice(1).map(line).join('')+'</section>').join('');
}
draw('phy',PHY);draw('mat',MAT);
document.getElementById('count').textContent=PHY.length+' physics notes and '+MAT.length+' maths notes, PUC I and II';
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const t=q.value.trim().toLowerCase();let shown=0;
  document.querySelectorAll('.note').forEach(n=>{
    const hit=!t||n.textContent.toLowerCase().includes(t);
    n.hidden=!hit;if(hit)shown++;
  });
  document.getElementById('none').style.display=shown?'none':'block';
});
